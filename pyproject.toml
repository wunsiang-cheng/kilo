[project]
name = "kilo"
version = "0.1.0"
description = "Autonomous AI Agent with Unrestricted Shell"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "aiosqlite>=0.20.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.20",
    "playwright>=1.64.1",
    "tzdata>=2026.6",
    "httpx>=0.27.0",
    "pillow>=12.0",
    "python-docx>=1.2",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    "python-pptx>=1.0.2",
]

[project.scripts]
kilo-server = "kilo.server.app:main"
kilo-line-browser = "kilo.line.launcher:main"
kilo-line-mcp = "kilo.line.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = ["live: calls the real OpenRouter API (needs credentials)"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
]

